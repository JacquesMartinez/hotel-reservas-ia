<div class="auth-wrap wide">
  <div class="page-head">
    <span class="eyebrow">User registration</span>
    <h1>Register new Fancy Hotel Account</h1>
  </div>

  <div class="card-ui state-card" ng-show="{{loggedInBool}}">
    <span class="state-icon"><span class="glyphicon glyphicon-ok"></span></span>
    <h2>You're already logged in!</h2>
    <p><a class="btn btn-primary" href="#/portal">Go to the user portal</a></p>
  </div>

  <div ng-hide="{{loggedInBool}}">
    <div class="card-ui">
      <form role="form" ng-submit="submit()" name="register">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Username" ng-model="username" autocomplete="username" required ng-pattern="myRegex">
          <span class="field-hint">Usernames must start with a C followed by 4 letters or numbers.</span>
          <span class="field-error" ng-show="register.username.$error.pattern">Please follow the username format!</span>
        </div>
        <div class="row">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" class="form-control" placeholder="First name" ng-model="firstName" autocomplete="given-name" required>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" class="form-control" placeholder="Last name" ng-model="lastName" autocomplete="family-name" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Email" ng-model="email" autocomplete="email" required>
        </div>
        <div class="row">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Password" ng-model="password" autocomplete="new-password" required>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="confirmPass">Confirm password</label>
              <input type="password" id="confirmPass" class="form-control" placeholder="Confirm password" ng-model="confirmPass" autocomplete="new-password" required>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Register</button>
      </form>
    </div>

    <p class="auth-alt">Already have an account? <a href="#/login">Log-in here</a></p>
  </div>
</div>

<!--Anyone registering needs to go into the database as a CUSTOMER-->
<!--Managers DO NOT register. EVER. They are prepopulated-->
<!--If a manager wants to act as a customer, they must register a seperate account-->
