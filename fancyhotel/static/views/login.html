<div class="auth-wrap">
  <div class="page-head">
    <span class="eyebrow">Welcome back</span>
    <h1>Login to your Fancy Hotel account</h1>
  </div>

  <div class="card-ui state-card" ng-show="{{loggedInBool}}">
    <span class="state-icon"><span class="glyphicon glyphicon-ok"></span></span>
    <h2>You're already logged in!</h2>
    <p><a class="btn btn-primary" href="#/portal">Go to the user portal</a></p>
  </div>

  <div ng-hide="{{loggedInBool}}">
    <div class="card-ui">
      <form role="form" ng-submit="submit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Username" ng-model="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="pwd">Password</label>
          <input type="password" id="pwd" class="form-control" placeholder="Password" ng-model="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
      </form>
    </div>

    <p class="auth-alt">New user? <a href="#/register">Register here</a></p>
  </div>
</div>
